name: Quality summary
description: >
  Merge SpotBugs SARIF, publish it to code scanning, and write a readable
  SpotBugs and SonarQube summary to the workflow run.

inputs:
  sonar-project-key:
    description: SonarQube project key. Defaults to the repository name.
    required: false
    default: ''
  sonar-token:
    description: >
      SonarQube user token with Browse permission. Analysis tokens can submit
      results but cannot read gate conditions or issues.
    required: false
    default: ''
  sonar-host-url:
    description: SonarQube base URL.
    required: false
    default: 'https://sonar.instanto.io'
  upload-sarif:
    description: Upload the merged SARIF to GitHub code scanning.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Merge SpotBugs SARIF
      shell: bash
      run: |
        set -euo pipefail
        mvn_bin="${MVN:-mvn}"
        args=(--batch-mode --no-transfer-progress)
        if [ -n "${MAVEN_SETTINGS:-}" ]; then args+=(--settings "$MAVEN_SETTINGS"); fi
        "$mvn_bin" "${args[@]}" io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:merge-sarif

    - name: Upload SpotBugs SARIF
      if: inputs.upload-sarif == 'true' && hashFiles('target/spotbugs-reports/spotbugs.sarif') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: target/spotbugs-reports/spotbugs.sarif
        category: spotbugs

    - name: Write quality summary
      if: always()
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
      run: |
        set -euo pipefail
        mvn_bin="${MVN:-mvn}"
        args=(--batch-mode --no-transfer-progress)
        if [ -n "${MAVEN_SETTINGS:-}" ]; then args+=(--settings "$MAVEN_SETTINGS"); fi
        "$mvn_bin" "${args[@]}" io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:quality-summary \
          "-Dinstanto.ci.sonarProjectKey=${SONAR_PROJECT_KEY}" \
          "-Dinstanto.ci.sonarHostUrl=${SONAR_HOST_URL}"
