name: Maven build

# Shared Maven job for Instanto repositories.
#
# It checks out the repository, writes Maven settings and runs Maven. The
# settings carry credentials for packages.instanto.io, where Instanto snapshots
# are published and resolved, and for every GitHub Packages repository the
# build declares. They also declare packages.instanto.io as a repository, which
# is what lets Maven find the shared parents at all: a parent cannot supply the
# repository it is published in. Callers supply only what differs from the
# defaults.
#
# Runners default to the organisation's container runners, which carry the tools
# these builds need. Pass runner-labels to
# send a job somewhere else — the JavaFX platform artifacts, for example, need
# hosted Windows and arm64 machines.
#
# Credentials: PACKAGES_TOKEN when the caller passes it, otherwise the job's own
# GITHUB_TOKEN. Every <repository> and <distributionManagement> id beginning
# with "github" in the repository's POMs gets a server entry, so a repository
# does not need to keep its own settings file.
#
# The optional artifacts.instanto.io credentials remain available to projects
# that publish there.

on:
  workflow_call:
    inputs:
      runner-labels:
        description: Runner labels, as a JSON array. Defaults to the container runners.
        type: string
        default: '["self-hosted", "instanto-container"]'
      java-version:
        description: Temurin JDK version.
        type: string
        default: '21'
      maven-version:
        description: Maven version to install when the repository has no wrapper and the runner has no Maven.
        type: string
        default: 3.9.16
      parents:
        description: >
          Parents to build from source before the build, one per line as
          "<owner/repo> <pom path>", for testing an unpublished parent. Published
          parents resolve from packages.instanto.io and need no entry.
        type: string
        default: ''
      goals:
        description: Maven goals and phases for the build step.
        type: string
        default: clean verify
      maven-args:
        description: Extra Maven arguments, such as -pl or -P.
        type: string
        default: ''
      timeout-minutes:
        description: Time limit for the job, so a hung browser cannot hold a runner indefinitely.
        type: number
        default: 30
      name:
        description: Label for the build step, so logs say what ran.
        type: string
        default: Verify Maven modules
      artifact-name:
        description: >
          Name to upload a build output under, for a later workflow such as a
          Pages deploy. Empty uploads nothing.
        type: string
        default: ''
      artifact-path:
        description: Path of the build output to upload, when artifact-name is set.
        type: string
        default: ''
      sonar:
        description: Run SonarQube analysis after verification when SONAR_TOKEN is present.
        type: boolean
        default: true
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the organisation's private packages and repositories.
        required: false
      FORGEJO_PACKAGE_USER:
        description: Forgejo account that publishes and reads Instanto snapshots on packages.instanto.io.
        required: false
      FORGEJO_PACKAGE_TOKEN:
        description: Token for that Forgejo account.
        required: false
      FORGEJO_PACKAGES_TOKEN:
        description: Fallback token name for that Forgejo account.
        required: false
      FORGEJO_PACKAGE_READ_TOKEN:
        description: Fallback read token name for that Forgejo account.
        required: false
      ARTIFACTS_USERNAME:
        description: Nexus account at artifacts.instanto.io, for jobs that deploy there.
        required: false
      ARTIFACTS_TOKEN:
        description: Password or token for that Nexus account.
        required: false
      SONAR_READ_TOKEN:
        description: Optional SonarQube token with Browse permission for failure diagnostics.
        required: false
      SONAR_TOKEN:
        description: SonarQube analysis token for sonar.instanto.io.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      MAVEN_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      MAVEN_ACTOR: ${{ github.actor }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      ARTIFACTS_USERNAME: ${{ secrets.ARTIFACTS_USERNAME }}
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_READ_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
      SONAR_HOST_URL: https://sonar.instanto.io
    steps:
      # Self-hosted machines are provisioned by hand and differ; record what
      # this one offers so a failure caused by the machine is visible as such.
      - name: Describe runner
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH})"
          echo "display: ${DISPLAY:-none}"
          for tool in git curl tar mvn google-chrome google-chrome-stable chromium chromium-browser firefox xvfb-run; do
            printf '  %-22s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # overwrite-settings is off because self-hosted runners keep their home
      # directory between jobs; credentials go to a job-local file instead.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          overwrite-settings: false

      - name: Make Maven available
        env:
          MAVEN_VERSION: ${{ inputs.maven-version }}
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then
            echo "MVN=$PWD/mvnw" >> "$GITHUB_ENV"
          elif command -v mvn >/dev/null 2>&1; then
            echo "MVN=$(command -v mvn)" >> "$GITHUB_ENV"
          else
            home="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/maven/${MAVEN_VERSION}"
            if [ ! -x "$home/bin/mvn" ]; then
              mkdir -p "$home"
              curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
                | tar -xz --strip-components=1 -C "$home"
            fi
            echo "$home/bin" >> "$GITHUB_PATH"
            echo "MVN=$home/bin/mvn" >> "$GITHUB_ENV"
          fi

      - name: Write Maven credentials
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/maven-settings.xml"
          ids=$( { find . -name pom.xml -not -path '*/target/*' -print0 \
                   | xargs -0 grep -hoE '<id>github[A-Za-z0-9._-]*</id>' || true; } \
                 | sed -E 's#</?id>##g' | sort -u)
          ids=$(printf '%s\ngithub\n' "$ids" | sed '/^$/d' | sort -u)
          {
            echo '<settings><servers>'
            for id in $ids; do
              echo "  <server><id>${id}</id><username>\${env.MAVEN_ACTOR}</username><password>\${env.MAVEN_TOKEN}</password></server>"
            done
            # packages.instanto.io, where snapshots are published and resolved.
            if [ -n "${FORGEJO_PACKAGE_TOKEN:-}" ]; then
              : "${FORGEJO_PACKAGE_USER:?FORGEJO_PACKAGE_USER is required with FORGEJO_PACKAGE_TOKEN}"
              echo '  <server><id>forgejo-instanto</id><username>${env.FORGEJO_PACKAGE_USER}</username><password>${env.FORGEJO_PACKAGE_TOKEN}</password></server>'
              echo "forgejo-instanto: credentials written" >&2
            fi
            # Only when the caller supplied them; a build that does not deploy to
            # Nexus should not fail for want of an account.
            if [ -n "${ARTIFACTS_TOKEN:-}" ]; then
              echo "  <server><id>artifacts</id><username>\${env.ARTIFACTS_USERNAME}</username><password>\${env.ARTIFACTS_TOKEN}</password></server>"
              echo "artifacts: credentials written" >&2
            fi
            echo '</servers>'
            # The bootstrap repository: Maven looks for a parent before it reads the
            # parent's own repositories, so packages.instanto.io has to be known here.
            echo '<profiles><profile><id>instanto-snapshots</id>'
            for kind in repositories:repository pluginRepositories:pluginRepository; do
              echo "  <${kind%:*}><${kind##*:}><id>forgejo-instanto</id><url>https://packages.instanto.io/api/packages/instanto-io/maven</url><releases><enabled>false</enabled></releases><snapshots><enabled>true</enabled></snapshots></${kind##*:}></${kind%:*}>"
            done
            echo '</profile></profiles><activeProfiles><activeProfile>instanto-snapshots</activeProfile></activeProfiles>'
            echo '</settings>'
          } > "$settings"
          echo "MAVEN_SETTINGS=$settings" >> "$GITHUB_ENV"
          echo "Credentials written for: $(echo $ids | tr '\n' ' ')"

      - name: Install shared parents
        if: inputs.parents != ''
        env:
          PARENTS: ${{ inputs.parents }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PARENTS" | while read -r repo pom; do
            [ -n "$repo" ] || continue
            dir="$RUNNER_TEMP/parents/$(basename "$repo")"
            rm -rf "$dir" && mkdir -p "$dir"
            # A tarball rather than git, which not every self-hosted runner has.
            curl -fsSL -H "Authorization: Bearer ${MAVEN_TOKEN}" \
              "https://api.github.com/repos/${repo}/tarball" \
              | tar -xz --strip-components=1 -C "$dir"
            echo "Installing ${repo}/${pom}"
            # A dependency's own quality gates are its repository's business, and
            # running them here only slows this build down.
            "$MVN" -B -ntp --settings "$MAVEN_SETTINGS" -f "${dir}/${pom}" install \
              -DskipTests -Dspotbugs.skip=true -Dspotless.check.skip=true -Dmaven.javadoc.skip=true
          done

      - name: ${{ inputs.name }}
        run: |
          set -euo pipefail
          # --update-snapshots: a runner that once missed a snapshot would otherwise
          # keep failing for a day, because Maven caches the miss.
          "$MVN" --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress --errors --fail-at-end \
            --update-snapshots \
            ${{ inputs.maven-args }} ${{ inputs.goals }}

      - name: SonarQube Quality Gate
        if: inputs.sonar && env.SONAR_TOKEN != '' && !contains(inputs.goals, 'deploy')
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          "$MVN" --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress \
            sonar:sonar \
            -Dsonar.projectKey="$repo_name" \
            -Dsonar.projectName="$repo_name" \
            -Dsonar.qualitygate.wait=true

      - name: Explain failed SonarQube quality gate
        if: failure() && inputs.sonar && env.SONAR_TOKEN != '' && !contains(inputs.goals, 'deploy')
        continue-on-error: true
        run: |
          python3 - <<'PYSONAR'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request
          host = os.environ["SONAR_HOST_URL"].rstrip("/")
          token = os.environ.get("SONAR_READ_TOKEN") or os.environ["SONAR_TOKEN"]
          project = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          def get(path, **params):
              url = host + path + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code in (401, 403):
                      print("::warning::Sonar analysis token cannot read diagnostics. Supply SONAR_READ_TOKEN with Browse permission or inspect the project dashboard.")
                      raise SystemExit(0) from None
                  raise
          report = pathlib.Path("target/sonar/report-task.txt")
          if not report.exists():
              print("No Sonar report task: the scanner failed before submitting analysis.")
              raise SystemExit(0)
          properties = dict(line.split("=", 1) for line in report.read_text().splitlines() if "=" in line)
          task = get("/api/ce/task", id=properties["ceTaskId"])["task"]
          analysis = task.get("analysisId")
          if not analysis:
              print("Sonar task status:", task.get("status"))
              raise SystemExit(0)
          gate = get("/api/qualitygates/project_status", analysisId=analysis)["projectStatus"]
          print("Quality gate:", gate["status"], "analysis:", analysis)
          for condition in gate.get("conditions", []):
              print(json.dumps(condition, sort_keys=True))
          issues = get("/api/issues/search", componentKeys=project, inNewCodePeriod="true", resolved="false", ps=100)
          print("Open issues in new code:", issues.get("total"))
          for issue in issues.get("issues", []):
              print(json.dumps({key: issue.get(key) for key in ("key", "rule", "severity", "component", "line", "message")}, sort_keys=True))
          PYSONAR

      - name: Upload ${{ inputs.artifact-name }}
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
