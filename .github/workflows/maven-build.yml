name: Maven build

# Shared Maven job for Instanto repositories.
#
# It checks out the repository, writes Maven settings and runs Maven. The
# settings carry credentials for packages.instanto.io, where Instanto snapshots
# are published and resolved, and for every GitHub Packages repository the
# build declares. They also declare packages.instanto.io as a repository, which
# is what lets Maven find the shared parents at all: a parent cannot supply the
# repository it is published in. Callers supply only what differs from the
# defaults.
#
# Runners default to the organisation's container runners, which carry the tools
# these builds need. Pass runner-labels to
# send a job somewhere else — the JavaFX platform artifacts, for example, need
# hosted Windows and arm64 machines.
#
# Credentials: PACKAGES_TOKEN when the caller passes it, otherwise the job's own
# GITHUB_TOKEN. Every <repository> and <distributionManagement> id beginning
# with "github" in the repository's POMs gets a server entry, so a repository
# does not need to keep its own settings file.
#
# The optional artifacts.instanto.io credentials remain available to projects
# that publish there.

on:
  workflow_call:
    inputs:
      runner-labels:
        description: Runner labels, as a JSON array. Defaults to the container runners.
        type: string
        default: '["self-hosted", "instanto-container"]'
      java-version:
        description: Temurin JDK version.
        type: string
        default: '21'
      maven-version:
        description: Maven version to install when the repository has no wrapper and the runner has no Maven.
        type: string
        default: 3.9.16
      parents:
        description: >
          Parents to build from source before the build, one per line as
          "<owner/repo> <pom path>", for testing an unpublished parent. Published
          parents resolve from packages.instanto.io and need no entry.
        type: string
        default: ''
      goals:
        description: Maven goals and phases for the build step.
        type: string
        default: clean verify
      maven-args:
        description: Extra Maven arguments, such as -pl or -P.
        type: string
        default: ''
      install-playwright:
        description: Let Playwright Java install its matching browser engines in a temporary job-local cache.
        type: boolean
        default: false
      timeout-minutes:
        description: Time limit for the job, so a hung browser cannot hold a runner indefinitely.
        type: number
        default: 30
      name:
        description: Label for the build step, so logs say what ran.
        type: string
        default: Verify Maven modules
      artifact-name:
        description: >
          Name to upload a build output under, for a later workflow such as a
          Pages deploy. Empty uploads nothing.
        type: string
        default: ''
      artifact-path:
        description: Path of the build output to upload, when artifact-name is set.
        type: string
        default: ''
      coverage-artifact:
        description: >
          Name of an artifact, uploaded by an earlier job in the same run with
          artifact-name, holding coverage reports such as TeaCoCo's
          teavm-coverage.xml. It is downloaded before SonarQube analysis, so one
          analysis sees both this job's JaCoCo reports and the other job's. The
          calling job must list that job in needs. Empty downloads nothing.
        type: string
        default: ''
      coverage-artifact-path:
        description: >
          Where to put coverage-artifact's files, relative to the checkout. An
          upload keeps paths relative to its files' common directory, so a single
          report needs its module's target directory here.
        type: string
        default: .
      publish-coverage-file:
        description: Single XML report to publish to Forgejo after verification on pushes and manual runs.
        type: string
        default: ''
      coverage-report-url:
        description: Forgejo coverage-report-url output from this run's producer job.
        type: string
        default: ''
      restore-coverage-file:
        description: Restore the published XML here after clean verify and before Sonar analysis.
        type: string
        default: ''
      downstream-checks:
        description: Verify registered downstream consumers after a successful default-branch deployment.
        type: boolean
        default: true
      fast-deploy:
        description: Skip tests, SpotBugs, JaCoCo, Javadoc, TeaCoCo, and Spotless for fast snapshot publication while keeping source jars attached.
        type: boolean
        default: false
      sonar:
        description: Run SonarQube analysis after verification when SONAR_TOKEN is present.
        type: boolean
        default: true
      sonar-quality-gate:
        description: >
          "advisory" reports a failed quality gate as a warning and lets the job
          pass, so snapshots still publish; "blocking" fails the job.
        type: string
        default: advisory
    outputs:
      coverage-report-url:
        description: Immutable Forgejo package URL for the published coverage report.
        value: ${{ jobs.build.outputs.coverage-report-url }}
    secrets:
      PACKAGES_TOKEN:
        description: Token with read access to the organisation's private packages and repositories.
        required: false
      FORGEJO_PACKAGE_USER:
        description: Forgejo account that publishes and reads Instanto snapshots on packages.instanto.io.
        required: false
      FORGEJO_PACKAGE_TOKEN:
        description: Token for that Forgejo account.
        required: false
      FORGEJO_PACKAGES_TOKEN:
        description: Fallback token name for that Forgejo account.
        required: false
      FORGEJO_PACKAGE_READ_TOKEN:
        description: Fallback read token name for that Forgejo account.
        required: false
      ARTIFACTS_USERNAME:
        description: Nexus account at artifacts.instanto.io, for jobs that deploy there.
        required: false
      ARTIFACTS_TOKEN:
        description: Password or token for that Nexus account.
        required: false
      SONAR_READ_TOKEN:
        description: Optional SonarQube token with Browse permission for failure diagnostics.
        required: false
      SONAR_TOKEN:
        description: SonarQube analysis token for sonar.instanto.io.
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    outputs:
      coverage-report-url: ${{ steps.publish-coverage.outputs.report-url }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      MAVEN_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      MAVEN_ACTOR: ${{ github.actor }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      ARTIFACTS_USERNAME: ${{ secrets.ARTIFACTS_USERNAME }}
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_READ_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
      SONAR_HOST_URL: https://sonar.instanto.io
      MAVEN_CENTRAL_MIRROR_URL: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
    steps:
      # Self-hosted machines are provisioned by hand and differ; record what
      # this one offers so a failure caused by the machine is visible as such.
      - name: Describe runner
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH})"
          echo "display: ${DISPLAY:-none}"
          for tool in git curl tar mvn google-chrome google-chrome-stable chromium chromium-browser firefox xvfb-run; do
            printf '  %-22s %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Allocate matching Playwright browser engines
        if: inputs.install-playwright
        run: |
          set -euo pipefail
          browser_cache=$(mktemp -d "$RUNNER_TEMP/maven-playwright.XXXXXX")
          echo "MAVEN_PLAYWRIGHT_CACHE=$browser_cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_cache" >> "$GITHUB_ENV"
          # Playwright Java downloads the revisions required by its driver when
          # the tests create Playwright, rather than relying on the runner image.
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0" >> "$GITHUB_ENV"

      # overwrite-settings is off because self-hosted runners keep their home
      # directory between jobs; credentials go to a job-local file instead.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          overwrite-settings: false

      - name: Restore runner-local Maven downloads
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: prepare
          maven-args: ${{ inputs.maven-args }}

      - name: Make Maven available
        env:
          MAVEN_VERSION: ${{ inputs.maven-version }}
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then
            echo "MVN=$PWD/mvnw" >> "$GITHUB_ENV"
          elif command -v mvn >/dev/null 2>&1; then
            echo "MVN=$(command -v mvn)" >> "$GITHUB_ENV"
          else
            home="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/maven/${MAVEN_VERSION}"
            if [ ! -x "$home/bin/mvn" ]; then
              mkdir -p "$home"
              archive="$RUNNER_TEMP/apache-maven.tar.gz"
              base="${MAVEN_CENTRAL_MIRROR_URL:-https://repo.maven.apache.org/maven2}"
              url="$base/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
              curl --retry 4 --retry-delay 3 --retry-max-time 90 -fsSL "$url" -o "$archive"
              curl --retry 4 --retry-delay 3 --retry-max-time 90 -fsSL "$url.sha512" -o "$archive.sha512"
              expected=$(awk '{print $1}' "$archive.sha512")
              if command -v sha512sum >/dev/null 2>&1; then
                actual=$(sha512sum "$archive" | awk '{print $1}')
              else
                actual=$(shasum -a 512 "$archive" | awk '{print $1}')
              fi
              if [ "$actual" != "$expected" ]; then
                echo "Maven distribution checksum mismatch" >&2
                exit 1
              fi
              tar -xz --strip-components=1 -C "$home" -f "$archive"
            fi
            echo "$home/bin" >> "$GITHUB_PATH"
            echo "MVN=$home/bin/mvn" >> "$GITHUB_ENV"
          fi

      - name: Write Maven credentials
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/maven-settings.xml"
          ids=$( { find . -name pom.xml -not -path '*/target/*' -print0 \
                   | xargs -0 grep -hoE '<id>github[A-Za-z0-9._-]*</id>' || true; } \
                 | sed -E 's#</?id>##g' | sort -u)
          ids=$(printf '%s\ngithub\n' "$ids" | sed '/^$/d' | sort -u)
          {
            echo '<settings><servers>'
            for id in $ids; do
              echo "  <server><id>${id}</id><username>\${env.MAVEN_ACTOR}</username><password>\${env.MAVEN_TOKEN}</password></server>"
            done
            # packages.instanto.io, where snapshots are published and resolved.
            if [ -n "${FORGEJO_PACKAGE_TOKEN:-}" ]; then
              : "${FORGEJO_PACKAGE_USER:?FORGEJO_PACKAGE_USER is required with FORGEJO_PACKAGE_TOKEN}"
              echo '  <server><id>forgejo-instanto</id><username>${env.FORGEJO_PACKAGE_USER}</username><password>${env.FORGEJO_PACKAGE_TOKEN}</password></server>'
              echo "forgejo-instanto: credentials written" >&2
            fi
            # Only when the caller supplied them; a build that does not deploy to
            # Nexus should not fail for want of an account.
            if [ -n "${ARTIFACTS_TOKEN:-}" ]; then
              echo "  <server><id>artifacts</id><username>\${env.ARTIFACTS_USERNAME}</username><password>\${env.ARTIFACTS_TOKEN}</password></server>"
              echo "artifacts: credentials written" >&2
            fi
            echo '</servers>'
            if [ -n "${MAVEN_CENTRAL_MIRROR_URL:-}" ]; then
              echo '<mirrors><mirror><id>central</id><mirrorOf>central</mirrorOf><url>${env.MAVEN_CENTRAL_MIRROR_URL}</url></mirror></mirrors>'
            fi
            # The bootstrap repository: Maven looks for a parent before it reads the
            # parent's own repositories, so packages.instanto.io has to be known here.
            echo '<profiles><profile><id>instanto-snapshots</id>'
            for kind in repositories:repository pluginRepositories:pluginRepository; do
              echo "  <${kind%:*}><${kind##*:}><id>forgejo-instanto</id><url>https://packages.instanto.io/api/packages/instanto-io/maven</url><releases><enabled>false</enabled></releases><snapshots><enabled>true</enabled></snapshots></${kind##*:}></${kind%:*}>"
            done
            echo '</profile></profiles><activeProfiles><activeProfile>instanto-snapshots</activeProfile></activeProfiles>'
            echo '</settings>'
          } > "$settings"
          echo "MAVEN_SETTINGS=$settings" >> "$GITHUB_ENV"
          echo "Credentials written for: $(echo $ids | tr '\n' ' ')"

      - name: Install shared parents
        if: inputs.parents != ''
        env:
          PARENTS: ${{ inputs.parents }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PARENTS" | while read -r repo pom; do
            [ -n "$repo" ] || continue
            dir="$RUNNER_TEMP/parents/$(basename "$repo")"
            rm -rf "$dir" && mkdir -p "$dir"
            # A tarball rather than git, which not every self-hosted runner has.
            curl -fsSL -H "Authorization: Bearer ${MAVEN_TOKEN}" \
              "https://api.github.com/repos/${repo}/tarball" \
              | tar -xz --strip-components=1 -C "$dir"
            echo "Installing ${repo}/${pom}"
            # A dependency's own quality gates are its repository's business, and
            # running them here only slows this build down.
            "$MVN" -B -ntp --settings "$MAVEN_SETTINGS" \
              -Daether.transport.http.connectTimeout=30000 \
              -Daether.transport.http.requestTimeout=120000 \
              -Daether.transport.http.retryHandler.count=8 \
              -Daether.transport.http.retryHandler.interval=10000 \
              -Daether.transport.http.retryHandler.serviceUnavailable=429,502,503,504 \
              -Dmaven.artifact.threads=2 \
              -f "${dir}/${pom}" install \
              -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dteacoco.skip=true -Dspotless.skip=true -Dmaven.javadoc.skip=true
          done

      - name: ${{ inputs.name }}
        env:
          MVN_ARGS: ${{ inputs.maven-args }}
          MVN_GOALS: ${{ inputs.goals }}
          FAST_DEPLOY: ${{ inputs.fast-deploy }}
        run: |
          set -euo pipefail
          # --update-snapshots: a runner that once missed a snapshot would otherwise
          # keep failing for a day, because Maven caches the miss.
          args=()
          if [ -n "${MVN_ARGS:-}" ]; then
            read -r -a raw_args <<< "$MVN_ARGS"
            for arg in "${raw_args[@]}"; do
              if [ -n "${RUNNER_TEMP:-}" ]; then
                arg="${arg//\$\{RUNNER_TEMP\}/$RUNNER_TEMP}"
                arg="${arg//\$RUNNER_TEMP/$RUNNER_TEMP}"
              fi
              args+=("$arg")
            done
          fi
          has_key() {
            local key="$1"
            local existing
            for existing in "${args[@]+"${args[@]}"}"; do
              if [ "${existing%%=*}" = "$key" ]; then
                return 0
              fi
            done
            return 1
          }
          resilience=()
          for flag in \
            "-Daether.transport.http.connectTimeout=30000" \
            "-Daether.transport.http.requestTimeout=120000" \
            "-Daether.transport.http.retryHandler.count=8" \
            "-Daether.transport.http.retryHandler.interval=10000" \
            "-Daether.transport.http.retryHandler.serviceUnavailable=429,502,503,504" \
            "-Dmaven.artifact.threads=2"; do
            if ! has_key "${flag%%=*}"; then
              resilience+=("$flag")
            fi
          done
          if [ "${FAST_DEPLOY:-false}" = "true" ]; then
            for flag in \
              "-DskipTests" \
              "-Dspotbugs.skip=true" \
              "-Djacoco.skip=true" \
              "-Dmaven.javadoc.skip=true" \
              "-Dteacoco.skip=true" \
              "-Dspotless.skip=true"; do
              if ! has_key "${flag%%=*}"; then
                args+=("$flag")
              fi
            done
          fi
          goals=()
          if [ -n "${MVN_GOALS:-}" ]; then
            read -r -a goals <<< "$MVN_GOALS"
          fi
          "$MVN" --settings "$MAVEN_SETTINGS" \
            --batch-mode --no-transfer-progress --errors --fail-at-end \
            --update-snapshots \
            ${resilience[@]+"${resilience[@]}"} \
            ${args[@]+"${args[@]}"} \
            ${goals[@]+"${goals[@]}"}

      # Coverage from another job, such as browser tests run separately, joins this
      # job's analysis. A missing artifact leaves that coverage out, not the build.
      - name: Download ${{ inputs.coverage-artifact }}
        if: inputs.coverage-artifact != '' && inputs.sonar && !inputs.fast-deploy && github.event_name != 'pull_request' && env.SONAR_TOKEN != '' && !contains(inputs.goals, 'deploy')
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.coverage-artifact-path }}

      - name: Restore coverage from Forgejo for SonarQube
        if: inputs.restore-coverage-file != '' && inputs.sonar && !inputs.fast-deploy && github.event_name != 'pull_request' && env.SONAR_TOKEN != '' && !contains(inputs.goals, 'deploy')
        shell: bash
        env:
          REPORT_URL: ${{ inputs.coverage-report-url }}
          REPORT_FILE: ${{ inputs.restore-coverage-file }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_READ_TOKEN || secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          prefix="https://packages.instanto.io/api/packages/instanto-io/generic/ci-${GITHUB_REPOSITORY/\//-}-coverage/"
          version_and_file=${REPORT_URL#"$prefix"}
          if [[ "$REPORT_URL" != "$prefix"* || ! "$version_and_file" =~ ^${GITHUB_RUN_ID}-[0-9]+-[0-9a-f]{32}/coverage\.tar\.gz$ ]]; then
            echo "::error::Expected a Forgejo coverage archive from the producer job in this run."
            exit 1
          fi
          mkdir -p -- "$(dirname -- "$REPORT_FILE")"
          temp_file=$(mktemp "${REPORT_FILE}.XXXXXX")
          trap 'rm -f -- "$temp_file"' EXIT
          curl --fail --silent --show-error --connect-timeout 15 --max-time 120 \
            --user "${FORGEJO_PACKAGE_USER:?}:${FORGEJO_PACKAGE_TOKEN:?}" "$REPORT_URL" \
            | tar -xzO -f - -- "$(basename -- "$REPORT_FILE")" > "$temp_file"
          test -s "$temp_file"
          mv -- "$temp_file" "$REPORT_FILE"

      - name: SonarQube Quality Gate
        id: sonar-gate
        if: inputs.sonar && !inputs.fast-deploy && github.event_name != 'pull_request' && env.SONAR_TOKEN != '' && !contains(inputs.goals, 'deploy')
        continue-on-error: ${{ inputs.sonar-quality-gate != 'blocking' }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          "$MVN" --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress \
            -Daether.transport.http.connectTimeout=30000 \
            -Daether.transport.http.requestTimeout=120000 \
            -Daether.transport.http.retryHandler.count=8 \
            -Daether.transport.http.retryHandler.interval=10000 \
            -Daether.transport.http.retryHandler.serviceUnavailable=429,502,503,504 \
            -Dmaven.artifact.threads=2 \
            sonar:sonar \
            -Dsonar.projectKey="$repo_name" \
            -Dsonar.projectName="$repo_name" \
            -Dsonar.qualitygate.wait=true

      - name: Explain failed SonarQube quality gate
        if: always() && steps.sonar-gate.outcome == 'failure'
        continue-on-error: true
        env:
          GATE_MODE: ${{ inputs.sonar-quality-gate }}
        run: |
          if [ "$GATE_MODE" != "blocking" ]; then
            echo "::warning title=SonarQube quality gate::The quality gate failed. It is advisory for this build, so the job continues; see the conditions below or the project dashboard."
          fi
          "$MVN" --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress \
            io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:sonar-diagnose

      - name: Check coverage report
        if: inputs.publish-coverage-file != ''
        env:
          REPORT_FILE: ${{ inputs.publish-coverage-file }}
        run: test -s "$REPORT_FILE"

      - name: Publish coverage to Forgejo
        id: publish-coverage
        if: inputs.publish-coverage-file != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REPORT_FILE: ${{ inputs.publish-coverage-file }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
        run: >-
          "$MVN" --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress --update-snapshots -N
          io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:publish-report
          -Dinstanto.ci.name=coverage "-Dinstanto.ci.paths=$REPORT_FILE"

      - name: Upload ${{ inputs.artifact-name }}
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

      # Verification runs publish SpotBugs and the SonarQube gate in a readable
      # form. Publication-only runs skip it: the caller's verify job owns that
      # analysis, and two uploads with the same code-scanning category conflict.
      - name: Publish quality summary
        if: always() && !inputs.fast-deploy && !contains(inputs.goals, 'deploy')
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: ${{ github.event.repository.name }}
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
          # Code scanning SARIF upload is disabled; SpotBugs and CVE results
          # render in the workflow summary and nightly security dashboard.
          upload-sarif: 'false'

      - name: Save runner-local Maven downloads
        if: always()
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: save
          maven-args: ${{ inputs.maven-args }}

      - name: Remove the job-local Playwright browser cache
        if: always() && inputs.install-playwright
        run: |
          if [ -n "${MAVEN_PLAYWRIGHT_CACHE:-}" ]; then
            rm -rf -- "$MAVEN_PLAYWRIGHT_CACHE"
          fi

  downstream:
    needs: build
    if: >-
      inputs.downstream-checks && !inputs.fast-deploy && contains(inputs.goals, 'deploy') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/downstream-build.yml
    with:
      runner-labels: ${{ inputs.runner-labels }}
      java-version: ${{ inputs.java-version }}
      maven-version: ${{ inputs.maven-version }}
    secrets: inherit
