name: Nightly compatibility, verification, and security cascade

# Reusable nightly orchestrator invoked ONLY from private instanto-io/sarto-framework so
# private repository metadata, test logs, Sonar metrics, and CVE reports stay
# isolated inside the private organisation run and nightly-state branch.

on:
  workflow_call:
    inputs:
      upstream:
        description: Optional comma-separated upstream project names to force into compatibility & security verification.
        type: string
        default: ''
      force:
        description: Force all registered projects to run regardless of unchanged SHAs.
        type: boolean
        default: false
      bootstrap_only:
        description: Record current default-branch HEAD SHAs into the baseline branch without building.
        type: boolean
        default: false
      state-branch:
        description: Orphan branch in the calling repository holding baseline.json.
        type: string
        default: nightly-state
      dry-run:
        description: Plan, build, and report without updating the baseline state branch.
        type: boolean
        default: false
    secrets:
      PACKAGES_TOKEN:
        required: false
      FORGEJO_PACKAGE_USER:
        required: false
      FORGEJO_PACKAGE_TOKEN:
        required: false
      FORGEJO_PACKAGES_TOKEN:
        required: false
      FORGEJO_PACKAGE_READ_TOKEN:
        required: false
      ARTIFACTS_USERNAME:
        required: false
      ARTIFACTS_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_READ_TOKEN:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  plan:
    name: Stage 1 - Plan changed upstreams and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix_include: ${{ steps.plan.outputs.matrix_include }}
    env:
      MAVEN_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
    steps:
      - name: Check out shared CI tooling
        uses: actions/checkout@v7
        with:
          repository: instanto-io/instanto-poms
          ref: main
          path: tooling
          persist-credentials: false

      - name: Check out nightly baseline state
        id: state-checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.state-branch }}
          path: state
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Install CI tooling plugin
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f tooling/pom.xml install \
            -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dspotless.skip=true -Dmaven.javadoc.skip=true

      - name: Compute incremental nightly build plan
        id: plan
        env:
          REQ_UPSTREAM: ${{ inputs.upstream }}
          REQ_FORCE: ${{ inputs.force }}
          REQ_BOOTSTRAP: ${{ inputs.bootstrap_only }}
        run: |
          set -euo pipefail
          mkdir -p state plan-out
          if [ ! -f state/baseline.json ]; then
            echo '{"schema_version": 1, "updated_at": null, "projects": {}}' > state/baseline.json
          fi
          mvn --batch-mode --no-transfer-progress \
            io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:nightly-plan \
            -Dinstanto.ci.catalog=tooling/.github/downstream-projects.json \
            -Dinstanto.ci.baseline=state/baseline.json \
            -Dinstanto.ci.outputDir=plan-out \
            "-Dinstanto.ci.upstream=${REQ_UPSTREAM}" \
            "-Dinstanto.ci.force=${REQ_FORCE}" \
            "-Dinstanto.ci.bootstrapOnly=${REQ_BOOTSTRAP}"

      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-artifacts
          path: plan-out
          retention-days: 7

  compat:
    name: Stage 2 - Compatibility cascade & blame isolation
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ["self-hosted", "instanto-container"]
    timeout-minutes: 300
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      MAVEN_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      MAVEN_ACTOR: ${{ github.actor }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      ARTIFACTS_USERNAME: ${{ secrets.ARTIFACTS_USERNAME }}
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
      MAVEN_CENTRAL_MIRROR_URL: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
    steps:
      - name: Allocate isolated compatibility workspace
        run: |
          rm -rf -- plan-out state
          directory=$(mktemp -d "$RUNNER_TEMP/nightly-compat-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")
          mkdir -p "$directory/plan-out"
          echo "NIGHTLY_WORKSPACE=$directory/build" >> "$GITHUB_ENV"
          echo "NIGHTLY_PLAN_DIR=$directory/plan-out" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$directory/build/browser-cache" >> "$GITHUB_ENV"
          echo "OVERLAY_ARCHIVE=$directory/m2-overlay.tar.gz" >> "$GITHUB_ENV"

      - name: Check out shared CI tooling
        uses: actions/checkout@v7
        with:
          repository: instanto-io/instanto-poms
          ref: main
          path: tooling
          persist-credentials: false

      - name: Check out nightly baseline state
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.state-branch }}
          path: state
          fetch-depth: 1
          persist-credentials: false

      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          name: plan-artifacts
          path: ${{ env.NIGHTLY_PLAN_DIR }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore runner-local Maven downloads
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: prepare
          maven-args: -Dmaven.repo.local=${{ env.NIGHTLY_WORKSPACE }}/m2

      - name: Ensure Maven is installed
        run: |
          set -euo pipefail
          if ! command -v mvn >/dev/null 2>&1; then
            maven_ver="3.9.16"
            maven_dir="$RUNNER_TEMP/nightly-maven-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$maven_dir"
            base="${MAVEN_CENTRAL_MIRROR_URL:-https://repo.maven.apache.org/maven2}"
            curl -fsSL --retry 3 --retry-delay 5 "${base}/org/apache/maven/apache-maven/${maven_ver}/apache-maven-${maven_ver}-bin.tar.gz" \
              | tar -xz --strip-components=1 -C "$maven_dir"
            echo "$maven_dir/bin" >> "$GITHUB_PATH"
          fi

      - name: Install CI tooling plugin
        run: |
          mvn --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=$NIGHTLY_WORKSPACE/m2" \
            -f tooling/pom.xml install \
            -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dspotless.skip=true -Dmaven.javadoc.skip=true

      - name: Build changed libraries and downstream consumers in isolated m2
        run: |
          set -euo pipefail
          mkdir -p state
          if [ ! -f state/baseline.json ]; then
            echo '{"schema_version": 1, "updated_at": null, "projects": {}}' > state/baseline.json
          fi
          mvn --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=$NIGHTLY_WORKSPACE/m2" \
            io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:nightly-compat \
            -Dinstanto.ci.catalog=tooling/.github/downstream-projects.json \
            "-Dinstanto.ci.plan=$NIGHTLY_PLAN_DIR/plan.json" \
            -Dinstanto.ci.baseline=state/baseline.json \
            "-Dinstanto.ci.workspace=$NIGHTLY_WORKSPACE" \
            "-Dinstanto.ci.overlayOut=$OVERLAY_ARCHIVE"

      - name: Upload verified local snapshot m2 overlay
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m2-overlay
          path: ${{ env.OVERLAY_ARCHIVE }}
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload compatibility & blame reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-reports
          path: ${{ env.NIGHTLY_WORKSPACE }}/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean compatibility workspace and overlay archive
        if: always()
        run: |
          if [ -n "${NIGHTLY_WORKSPACE:-}" ]; then rm -rf -- "$(dirname "$NIGHTLY_WORKSPACE")"; fi
          if [ -n "${OVERLAY_ARCHIVE:-}" ]; then rm -f -- "$OVERLAY_ARCHIVE"; fi

  verify-and-security:
    name: "Stage 3 - Verify & Security (${{ matrix.name }})"
    needs: [plan, compat]
    if: needs.plan.outputs.should_run == 'true' && needs.compat.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_include) }}
    runs-on: ${{ matrix.runner_labels }}
    timeout-minutes: 120
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ${{ matrix.install_playwright && '0' || '1' }}
      MAVEN_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      MAVEN_ACTOR: ${{ github.actor }}
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      ARTIFACTS_USERNAME: ${{ secrets.ARTIFACTS_USERNAME }}
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_READ_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
      SONAR_HOST_URL: https://sonar.instanto.io
      SONAR_PROJECT_KEY: ${{ matrix.name }}
      MAVEN_CENTRAL_MIRROR_URL: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
    steps:
      - name: Allocate isolated verification workspace
        run: |
          rm -rf -- stage3-out overlay
          directory=$(mktemp -d "$RUNNER_TEMP/nightly-verify-${{ matrix.name }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")
          mkdir -p "$directory/m2" "$directory/logs" "$directory/overlay" "$directory/out"
          echo "VERIFY_WORKSPACE=$directory" >> "$GITHUB_ENV"
          echo "VERIFY_M2=$directory/m2" >> "$GITHUB_ENV"
          echo "VERIFY_SETTINGS=$directory/settings.xml" >> "$GITHUB_ENV"
          echo "VERIFY_LOGS=$directory/logs" >> "$GITHUB_ENV"
          echo "VERIFY_OVERLAY=$directory/overlay" >> "$GITHUB_ENV"
          echo "VERIFY_OUT=$directory/out" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$directory/browsers" >> "$GITHUB_ENV"

      - name: Check out shared CI tooling
        uses: actions/checkout@v7
        with:
          repository: instanto-io/instanto-poms
          ref: main
          path: tooling
          persist-credentials: false

      - name: Check out target repository at pinned SHA
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: target-repo
          fetch-depth: 0
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}
          persist-credentials: false

      - name: Download verified m2 snapshot overlay
        uses: actions/download-artifact@v4
        with:
          name: m2-overlay
          path: ${{ env.VERIFY_OVERLAY }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - uses: actions/setup-node@v4
        if: matrix.node_version != ''
        with:
          node-version: ${{ matrix.node_version }}

      - name: Restore runner-local Maven downloads
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: prepare
          maven-args: -Dmaven.repo.local=${{ env.VERIFY_M2 }}

      - name: Ensure Maven is installed and locate executable
        run: |
          set -euo pipefail
          if [ -x target-repo/mvnw ]; then
            echo "VERIFY_MVN=$PWD/target-repo/mvnw" >> "$GITHUB_ENV"
          elif command -v mvn >/dev/null 2>&1; then
            echo "VERIFY_MVN=$(command -v mvn)" >> "$GITHUB_ENV"
          else
            maven_ver="3.9.16"
            maven_dir="$RUNNER_TEMP/nightly-maven-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$maven_dir"
            base="${MAVEN_CENTRAL_MIRROR_URL:-https://repo.maven.apache.org/maven2}"
            curl -fsSL --retry 3 --retry-delay 5 "${base}/org/apache/maven/apache-maven/${maven_ver}/apache-maven-${maven_ver}-bin.tar.gz" \
              | tar -xz --strip-components=1 -C "$maven_dir"
            echo "$maven_dir/bin" >> "$GITHUB_PATH"
            echo "VERIFY_MVN=$maven_dir/bin/mvn" >> "$GITHUB_ENV"
          fi

      - name: Install CI tooling plugin
        run: |
          "$VERIFY_MVN" --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=$VERIFY_M2" \
            -f tooling/pom.xml install \
            -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dspotless.skip=true -Dmaven.javadoc.skip=true

      - name: Run full verification and coverage suite
        id: verify
        run: |
          set -euo pipefail
          overlay_arg=()
          for candidate in "$VERIFY_OVERLAY"/*.tar.gz; do
            if [ -f "$candidate" ]; then
              overlay_arg+=("-Dinstanto.ci.overlay=$candidate")
              break
            fi
          done
          "$VERIFY_MVN" --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=$VERIFY_M2" \
            io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:nightly-verify \
            -Dinstanto.ci.catalog=tooling/.github/downstream-projects.json \
            "-Dinstanto.ci.project=${{ matrix.name }}" \
            -Dinstanto.ci.checkout=target-repo \
            "-Dinstanto.ci.repository=$VERIFY_M2" \
            "-Dinstanto.ci.settings=$VERIFY_SETTINGS" \
            "-Dinstanto.ci.logDir=$VERIFY_LOGS" \
            ${overlay_arg[@]+"${overlay_arg[@]}"}

      - name: Submit SonarQube analysis and quality gate
        if: success() && env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          "$VERIFY_MVN" --batch-mode --no-transfer-progress \
            "-Dmaven.repo.local=$VERIFY_M2" \
            io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:nightly-sonar \
            -Dinstanto.ci.catalog=tooling/.github/downstream-projects.json \
            "-Dinstanto.ci.project=${{ matrix.name }}" \
            -Dinstanto.ci.checkout=target-repo \
            "-Dinstanto.ci.repository=$VERIFY_M2" \
            "-Dinstanto.ci.settings=$VERIFY_SETTINGS" \
            "-Dinstanto.ci.logDir=$VERIFY_LOGS"

      - name: Generate CycloneDX SBOM and scan CVEs
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/security-audit@main
        with:
          repo-name: ${{ matrix.name }}
          revision: ${{ matrix.sha }}
          working-directory: target-repo
          maven-executable: ${{ env.VERIFY_MVN }}
          maven-settings: ${{ env.VERIFY_SETTINGS }}
          maven-repo-local: ${{ env.VERIFY_M2 }}
          append-step-summary: 'true'

      - name: Collect Stage 3 status and security metrics
        if: always()
        env:
          PROJECT_NAME: ${{ matrix.name }}
          PROJECT_SHA: ${{ matrix.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          out_dir="${VERIFY_OUT:-$RUNNER_TEMP/stage3-out-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          mkdir -p "$out_dir"
          status="failed"
          if [ "${VERIFY_OUTCOME:-}" = "success" ]; then
            status="passed"
          fi
          printf '{\n  "project": "%s",\n  "sha": "%s",\n  "status": "%s"\n}\n' \
            "$PROJECT_NAME" "$PROJECT_SHA" "$status" > "$out_dir/${PROJECT_NAME}.status.json"
          if [ -f "target-repo/target/security/security-summary.json" ]; then
            cp -f "target-repo/target/security/security-summary.json" "$out_dir/${PROJECT_NAME}.security-summary.json"
          fi
          if [ -n "${VERIFY_LOGS:-}" ] && [ -d "$VERIFY_LOGS" ]; then
            cp -R "$VERIFY_LOGS"/. "$out_dir"/ || true
          fi

      - name: Upload Stage 3 metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics-${{ matrix.name }}
          path: ${{ env.VERIFY_OUT }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Save runner-local Maven downloads
        if: always()
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: save
          maven-args: -Dmaven.repo.local=${{ env.VERIFY_M2 }}

      - name: Clean verification workspace
        if: always()
        run: |
          if [ -n "${VERIFY_WORKSPACE:-}" ]; then rm -rf -- "$VERIFY_WORKSPACE"; fi
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then rm -rf -- "$PLAYWRIGHT_BROWSERS_PATH"; fi

  finalize:
    name: Stage 4 - Dashboard & Baseline State
    needs: [plan, compat, verify-and-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out shared CI tooling
        uses: actions/checkout@v7
        with:
          repository: instanto-io/instanto-poms
          ref: main
          path: tooling
          persist-credentials: false

      - name: Download nightly run artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Install CI tooling plugin
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f tooling/pom.xml install \
            -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dspotless.skip=true -Dmaven.javadoc.skip=true

      - name: Render unified Nightly Dashboard
        run: |
          set -euo pipefail
          plan_summary="artifacts/plan-artifacts/plan-summary.md"
          if [ -f "$plan_summary" ]; then
            cat "$plan_summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          mode="${{ needs.plan.outputs.mode }}"
          if [ "$mode" = "run" ]; then
            compat_args=()
            if [ -f "artifacts/compat-reports/compat-summary.md" ]; then
              compat_args+=("-Dinstanto.ci.compatSummary=artifacts/compat-reports/compat-summary.md")
            fi
            mvn --batch-mode --no-transfer-progress \
              io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:security-dashboard \
              -Dinstanto.ci.artifactsDir=artifacts \
              -Dinstanto.ci.mdOut=nightly-dashboard.md \
              -Dinstanto.ci.appendStepSummary=true \
              ${compat_args[@]+"${compat_args[@]}"}
          fi

      - name: Check out nightly baseline branch for update
        if: >-
          !inputs.dry-run &&
          needs.plan.result == 'success' &&
          needs.plan.outputs.mode != 'skip'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.state-branch }}
          path: state-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Persist updated baseline.json to nightly-state
        if: >-
          !inputs.dry-run &&
          needs.plan.result == 'success' &&
          needs.plan.outputs.mode != 'skip'
        env:
          STATE_BRANCH: ${{ inputs.state-branch }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          REPO_SLUG: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d state-repo/.git ] || ! git -C state-repo rev-parse --verify HEAD >/dev/null 2>&1; then
            rm -rf state-repo
            mkdir -p state-repo
            git -C state-repo init -q
            git -C state-repo remote add origin "https://github.com/${REPO_SLUG}.git"
            git -C state-repo checkout --orphan "$STATE_BRANCH"
          fi
          if [ "$PLAN_MODE" = "bootstrap" ]; then
            cp artifacts/plan-artifacts/bootstrap-baseline.json state-repo/baseline.json
          else
            if [ ! -f state-repo/baseline.json ]; then
              echo '{"schema_version": 1, "updated_at": null, "projects": {}}' > state-repo/baseline.json
            fi
            compat_args=()
            if [ -f "artifacts/compat-reports/compat-results.json" ]; then
              compat_args+=("-Dinstanto.ci.compatResults=artifacts/compat-reports/compat-results.json")
            fi
            mvn --batch-mode --no-transfer-progress \
              io.instanto:instanto-ci-maven-plugin:0.1.0-SNAPSHOT:nightly-update-baseline \
              -Dinstanto.ci.catalog=tooling/.github/downstream-projects.json \
              -Dinstanto.ci.baseline=state-repo/baseline.json \
              -Dinstanto.ci.plan=artifacts/plan-artifacts/plan.json \
              -Dinstanto.ci.artifactsDir=artifacts \
              -Dinstanto.ci.out=state-repo/baseline.json \
              ${compat_args[@]+"${compat_args[@]}"}
          fi

          git -C state-repo config user.name "github-actions[bot]"
          git -C state-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state-repo add baseline.json
          if git -C state-repo diff --cached --quiet; then
            echo "baseline.json unchanged."
            exit 0
          fi
          git -C state-repo commit -m "chore(nightly): update baseline (${PLAN_MODE}, run ${GITHUB_RUN_NUMBER:-0})"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          pushed=0
          for attempt in 1 2 3; do
            if git -C state-repo push origin "HEAD:${STATE_BRANCH}"; then
              pushed=1
              break
            fi
            git -C state-repo fetch --depth=1 origin "$STATE_BRANCH" || true
            git -C state-repo pull --rebase origin "$STATE_BRANCH" || true
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push baseline.json to ${STATE_BRANCH}"
            exit 1
          fi

      - name: Enforce overall nightly outcome
        if: >-
          needs.plan.result == 'failure' ||
          needs.compat.result == 'failure' ||
          needs.verify-and-security.result == 'failure'
        run: |
          echo "::error::Nightly cascade failed (plan=${{ needs.plan.result }}, compat=${{ needs.compat.result }}, verify-and-security=${{ needs.verify-and-security.result }})."
          exit 1
