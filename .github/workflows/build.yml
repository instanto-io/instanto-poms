name: Build and publish parents

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/maven-build.yml
    with:
      name: Verify Maven parents and CI plugin
      parents: ''
      goals: clean install
      sonar: false
      downstream-checks: false
    secrets: inherit

  publish-snapshot:
    if: github.repository == 'instanto-io/instanto-poms' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/maven-build.yml
    with:
      name: Publish Maven parent and CI plugin snapshots
      parents: ''
      goals: deploy
      fast-deploy: true
      downstream-checks: false
      sonar: false
    secrets: inherit
