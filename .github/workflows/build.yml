name: Build and publish parents

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/maven-build.yml
    with:
      name: Verify Maven parents
      parents: ''
      goals: clean verify
    secrets: inherit

  coverage-inheritance:
    name: Verify inherited test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check coverage reports and test JVM options
        run: python3 src/it/verify-coverage.py
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-inheritance-logs
          path: target/coverage-inheritance/*.log

  publish-snapshot:
    if: github.repository == 'instanto-io/instanto-poms' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, coverage-inheritance]
    uses: ./.github/workflows/maven-build.yml
    with:
      name: Publish Maven parent snapshots
      parents: ''
      goals: deploy
      maven-args: -DskipTests
    secrets: inherit
